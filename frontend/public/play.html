<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <title>World of Nads</title>
    <style>
      html, body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #000;
      }

      body {
        color: #fff;
        font-family: Inter, system-ui, sans-serif;
      }

      .play-shell {
        position: fixed;
        inset: 0;
        width: 100vw;
        height: 100dvh;
        overflow: hidden;
        background:
          radial-gradient(circle at top, rgba(231, 149, 231, 0.18), transparent 40%),
          linear-gradient(180deg, #080808 0%, #000 100%);
      }

      .game-frame {
        width: 100%;
        height: 100%;
        border: 0;
      }

      .fullscreen-btn {
        position: fixed;
        bottom: 1rem;
        left: 1rem;
        z-index: 20;
        width: 3rem;
        height: 3rem;
        padding: 0;
        border-radius: 0;
        border: none;
        background: #ff7ab6;
        color: #fff;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        cursor: grab;
        gap: 0;
        backdrop-filter: none;
        font-size: 0.92rem;
        font-weight: 700;
        letter-spacing: 0.01em;
        text-shadow: none;
        box-shadow: none;
        transform: skewX(-8deg);
        transition: background 0.2s ease;
        -webkit-user-select: none;
        user-select: none;
      }

      .fullscreen-btn:hover {
        background: #ffa9d0;
      }

      .fullscreen-btn svg {
        width: 1.5rem;
        height: 1.5rem;
        pointer-events: none;
        display: block;
      }

      .fullscreen-btn[hidden] {
        display: none;
      }

      .status {
        position: absolute;
        inset: 0;
        z-index: 20;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 1rem;
        text-align: center;
        background: transparent;
        border: none;
        font-size: 1rem;
        font-weight: 600;
        letter-spacing: 0.02em;
        color: #ff7ab6;
        text-shadow: 0 0 18px rgba(231, 149, 231, 0.55);
        backdrop-filter: none;
      }

      .status[hidden] {
        display: none;
      }
    </style>
  </head>
  <body>
    <div class="play-shell" id="playShell">
      <div class="status" id="status">Loading game shell...</div>
      <button type="button" class="fullscreen-btn" id="fullscreenBtn" aria-label="Click for fullscreen" hidden>
        <svg id="fsExpand" viewBox="0 0 24 24" fill="#fff" aria-hidden="true" style="display: none;">
          <path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z" />
        </svg>
        <svg id="fsCompress" viewBox="0 0 24 24" fill="#fff" aria-hidden="true" style="display: none;">
          <path d="M5 16h3v3h2v-5H5v2zm3-8H5v2h5V5H8v3zm6 11h2v-3h3v-2h-5v5zm2-11V5h-2v5h5V8h-3z" />
        </svg>
      </button>
      <iframe id="gameFrame" class="game-frame" title="World of Nads"></iframe>
    </div>

    <script>
      (function () {
        const resolveGameSkinName = (rawSkin) => {
          const key = String(rawSkin || "").trim().toLowerCase().replace(/\s+/g, " ");
          return key || "s-default";
        };

        const status = document.getElementById("status");
        const frame = document.getElementById("gameFrame");
        const fullscreenBtn = document.getElementById("fullscreenBtn");
        const fsExpand = document.getElementById("fsExpand");
        const fsCompress = document.getElementById("fsCompress");
        const shell = document.getElementById("playShell");
        const params = new URLSearchParams(window.location.search);
        const username = params.get("username") || "";
        const skin = resolveGameSkinName(params.get("skin") || params.get("skinName") || "s-default");
        const match = params.get("match") || "";
        const gameParams = new URLSearchParams();
        if (username) gameParams.set("username", username);
        if (skin) gameParams.set("skin", skin);
        if (match) gameParams.set("match", match);
        const resolveBaseUrl = () => {
          const queryBase = params.get("godotBaseUrl") || "";
          const globalBase = typeof window.GODOT_BASE_URL === "string" ? window.GODOT_BASE_URL : "";
          const originBase = `${window.location.origin}/godot/`;
          const rawBase = queryBase || globalBase || originBase;
          return rawBase.endsWith("/") ? rawBase : `${rawBase}/`;
        };

        let revealTimer = null;

        const gameUrl = `${resolveBaseUrl()}index.html?${gameParams.toString()}`;
        const baseOrigin = new URL(resolveBaseUrl(), window.location.href).origin;

        if (baseOrigin !== window.location.origin) {
          window.location.replace(gameUrl);
          return;
        }

        frame.src = gameUrl;

        frame.addEventListener("load", () => {
          status.hidden = true;
          try {
            frame.contentWindow?.postMessage({ type: "set_username", value: username }, "*");
            frame.contentWindow?.postMessage({ type: "set_skin", value: skin }, "*");
            if (match) {
              frame.contentWindow?.postMessage({ type: "set_match", value: match }, "*");
            }
          } catch (error) {
            console.warn("Could not send username to game frame:", error);
          }
        });

        const updateFullscreenButton = () => {
          if (revealTimer) {
            clearTimeout(revealTimer);
            revealTimer = null;
          }

          if (document.fullscreenElement) {
            fullscreenBtn.hidden = true;
            fullscreenBtn.setAttribute("aria-label", "Exit full screen");
            return;
          }

          fullscreenBtn.setAttribute("aria-label", "Click for fullscreen");
          if (fsExpand && fsCompress) {
            fsExpand.style.display = "block";
            fsCompress.style.display = "none";
          }
          revealTimer = setTimeout(() => {
            fullscreenBtn.hidden = !document.fullscreenEnabled;
            revealTimer = null;
          }, 300);
        };

        updateFullscreenButton();

        fullscreenBtn.addEventListener("click", async () => {
          try {
            if (!document.fullscreenElement && shell.requestFullscreen) {
              await shell.requestFullscreen({ navigationUI: "hide" });
            }
          } catch (error) {
            console.warn("Fullscreen request failed:", error);
          }
        });

        document.addEventListener("fullscreenchange", updateFullscreenButton);
      }());
    </script>
  </body>
</html>
