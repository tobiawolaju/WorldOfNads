<meta name="apple-mobile-web-app-title" content="World of Nads" />

  <link rel="preload" href="/fonts/InterVariable-latin.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="preload" href="/fonts/ABCFavorit-Medium.woff2" as="font" type="font/woff2" crossorigin />
  <script>
    if (typeof global === 'undefined') {
      window.global = window;
    }
  </script>
  <style>
    /* Inter ships as a 843 KB TrueType variable font; these are the same face
       split into Google's latin / latin-ext WOFF2 subsets (47 KB + 83 KB), so a
       visitor downloads a seventh of it. Anything outside those ranges falls
       back to the system stack in --font-inter. */
    @font-face {
      font-family: 'Inter';
      src: url('/fonts/InterVariable-latin.woff2') format('woff2');
      font-weight: 100 900;
      font-style: normal;
      font-display: swap;
      unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
    }

    @font-face {
      font-family: 'Inter';
      src: url('/fonts/InterVariable-latin-ext.woff2') format('woff2');
      font-weight: 100 900;
      font-style: normal;
      font-display: swap;
      unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C4, U+2113, U+2C60-2C7F, U+A720-A7FF;
    }

    @font-face {
      font-family: 'ABC Favorit';
      src: url('/fonts/ABCFavorit-Medium.woff2') format('woff2');
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }
  </style>
</head>

</body>
