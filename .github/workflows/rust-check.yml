name: rust-check

# Compile-verifies and unit-tests the Rust room server in CI. Nobody runs Rust or Docker
# on a dev machine for this project (see AGENTS.md: installs happen in CI/deploy), so this
# is the check for backend-rust until it is built on the deploy target.
on:
  push:
    paths:
      - "backend-rust/**"
      - ".github/workflows/rust-check.yml"
  pull_request:
    paths:
      - "backend-rust/**"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend-rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # --all-targets also compiles the unit tests and dev-dependencies.
      #
      # The step output is piped through `tee` and the compiler errors are echoed as
      # `::error::` lines: GitHub turns those into check annotations, which are
      # readable through the API. The raw log is only downloadable with repository
      # admin rights, so without this a failing build is a black box here.
      #
      # `set +e` + `PIPESTATUS[0]` is load-bearing: without it the step's exit code is
      # `tee`'s (always 0), so a broken build reported success. That happened: the
      # room-server image failed to compile while this job was green.
      - name: Run cargo check --all-targets
        run: |
          set +e
          cargo check --all-targets 2>&1 | tee check.log
          status=${PIPESTATUS[0]}
          grep -E '^(error|error\[|  -->)' check.log | head -40 | sed 's/^/::error::/' || true
          exit $status
      # The win condition (60s possession -> instant win, buzzer split) and the
      # round-end close are covered by unit tests, so CI is where they are proven.
      - name: Run cargo test --all-targets
        run: |
          set +e
          cargo test --all-targets 2>&1 | tee test.log
          status=${PIPESTATUS[0]}
          grep -E '(^error|^test .* FAILED|panicked at|^failures:)' test.log | head -40 | sed 's/^/::error::/' || true
          exit $status

