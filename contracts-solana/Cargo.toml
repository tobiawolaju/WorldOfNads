[workspace]
resolver = "2"
members = ["programs/*"]

[workspace.package]
edition = "2021"
version = "0.1.0"

[workspace.dependencies]
anchor-lang = { version = "0.30.1", features = ["init-if-needed"] }
anchor-spl = "0.30.1"
solana-program = "2.1.0"
spl-token = { version = "5", features = ["no-entrypoint"] }
spl-associated-token-account = { version = "3", features = ["no-entrypoint"] }
