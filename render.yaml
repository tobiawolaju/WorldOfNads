  - type: web
    name: wons-room-server
    runtime: docker
    # free = 750 h/month. It sleeps after ~15 min without traffic, so the first
    # websocket connect after a cold start takes ~30-60 s (or times out once).
    # Switch to `starter` if test sessions hit reconnect timeouts.
    plan: free
    # Both paths are relative to the repo root. The context is the crate dir so
    # godot/ and frontend/ are never sent to the Docker builder.
    dockerfilePath: ./backend-rust/Dockerfile
    dockerContext: ./backend-rust
    healthCheckPath: /health
    envVars:
      - key: RUST_LOG
        value: room_server=info
      # Node control plane the room server mirrors its allocated-match list from
      # (GET /internal/matches). Defaults to the public API in code; override for
      # local/dev.
      - key: CONTROL_PLANE_URL
        value: https://worldofnads.onrender.com
      # 0 (default) routes to `default` if the registry cannot verify a match id;
      # 1 also rejects when the registry has no data. An id the registry *can* verify
      # as unallocated is always refused.
      # - key: STRICT_ROOMS
      #   value: "1"
      # Set the SAME value here and on the Node backend to require the
      # `x-internal-secret` header on GET /internal/matches.
      # - key: INTERNAL_SECRET
      #   sync: false

  # Bot swarm for load-testing the Rust room server (phones can spawn bots via URL).
  - type: web
    name: wons-bot-runner
    runtime: node
    plan: free
    rootDir: bot-runner
    buildCommand: npm install
    startCommand: node bot.js
    healthCheckPath: /health
    envVars:
      - key: BOT_SERVER_URL
        value: wss://wons-room-server.onrender.com
      - key: BOT_MAX_COUNT
        value: 300
      - key: BOT_TICK_MS
        value: 33
